[pipeline]
seed = 2026
patch_count = 30
pair_sample_count = 4096
capture_count = 3
log_curvature = 24.0
color_model = "3x9"
ridge = 0.00001
lut_size = 65
neutral_width_cells = 1

[measurement_policy]
black_anchor = "bypass"
controlled_exposure = "linear_x_only"
local_white_gradient = "bypass_preserve_gradient"
paired_transfer = "bypass_same_position"
image_spatial_correction = "linear_before_lut"
geometry_id = "synthetic_fixed_geometry"

[quality]
max_flat_field_residual_cv = 0.005
max_ccm_mean_delta_e00 = 0.25
max_hlg_path_rmse = 0.001
max_raw_path_rmse = 0.001
max_dual_path_disagreement_rmse = 0.001
max_lut_mean_delta_e00 = 1.0
max_lut_p95_delta_e00 = 2.0
max_gray_reverse_steps = 0
max_gray_channel_spread = 0.000001
